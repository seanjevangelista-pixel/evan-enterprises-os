<style>
body{min-height:100vh;position:relative}
.blob{position:fixed;z-index:-1;border-radius:50%;opacity:.7;filter:blur(1px);animation:float 9s ease-in-out infinite}
.blob--a{width:220px;height:220px;background:var(--lilac);top:-70px;right:-60px;--rot:0deg}
.blob--b{width:140px;height:140px;background:var(--mint);bottom:18%;left:-50px;animation-delay:-3s}
.blob--c{width:90px;height:90px;background:var(--yellow);top:46%;right:-30px;animation-delay:-6s}
.col{max-width:560px;margin:0 auto;padding:48px 20px 20px}
.hero{text-align:center}
.avatar{position:relative;width:128px;height:128px;margin:0 auto}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 18%;border:var(--line);border-radius:50%;background:var(--yellow);box-shadow:var(--shadow)}
.avatar .sticker{position:absolute;right:-34px;bottom:-4px;animation:wiggle 3.2s ease-in-out infinite}
.hero h1{margin-top:24px}
.hero p{margin-top:10px}
.group{margin-top:34px}
.group-title{margin-bottom:12px;padding-left:4px}
.lnk{display:flex;align-items:center;gap:14px;padding:15px 18px;margin-bottom:14px;color:var(--ink);transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.lnk:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.lnk:active{transform:translateY(0);box-shadow:0 6px 16px -8px rgba(14,14,18,.3)}
.lnk--yellow{background:var(--yellow)}
.lnk--lilac{background:var(--lilac)}
.lnk--pink{background:var(--card)}
.lnk--blue{background:var(--blue);color:#fff}
.lnk--mint{background:var(--card)}
.lnk-ic{flex:none;width:44px;height:44px;border:var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.lnk-ic img{width:24px;height:24px;object-fit:contain}
.lnk-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lnk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.3}
.lnk-name{font:800 18px var(--font-display);letter-spacing:-.01em;line-height:1.2}
.lnk-desc{font-size:13.5px;opacity:.75;line-height:1.4;margin-top:2px}
.lnk-go{font:800 22px var(--font-display);transition:transform .2s var(--ease)}
.lnk:hover .lnk-go{transform:translateX(4px)}
.lnk.is-off{cursor:default;box-shadow:none;border-style:dashed;background:var(--paper-2);color:var(--ink-soft)}
.lnk.is-off .lnk-ic{opacity:.7}
.lnk.is-off:hover{transform:none;box-shadow:none}
.soon{font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;border:var(--line);border-radius:999px;padding:3px 9px;background:var(--paper)}
.disclosure{font-size:13px;margin:6px 4px 0}
</style>
</head>
<body>
<div class="blob blob--a"></div><div class="blob blob--b"></div><div class="blob blob--c"></div>

<main class="col">
  <header class="hero">
    <div class="avatar rv">
      <img src="/ugc/img/sean-hero.jpg" alt="Sean Evangelista" width="128" height="128">
      <span class="sticker sticker--pink">Austin, TX</span>
    </div>
    <h1 class="display rv" style="--i:1;font-size:clamp(34px,9vw,48px)">Sean Jayme</h1>
    <p class="muted rv" style="--i:2">Lead systems, AI &amp; UGC — one person doing the work.</p>
  </header>

  <div id="groups"></div>

  <footer class="site-foot">
    <p>© 2026 Evan Enterprises LLC · <a href="/privacy.html">Privacy</a></p>
  </footer>
</main>

<script src="/js/site.js"></script>
<script>
(function(){
  var ICONS={
    calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    chat:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>',
    grid:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    video:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="M16 10l6-3v10l-6-3"/></svg>',
    list:'<svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>'
  };
  var GROUPS=[
    {id:'start',title:'Start here'},
    {id:'watch',title:'Watch my content'},
    {id:'business',title:'Business'},
    {id:'affiliate',title:'Affiliate picks',note:'Some of these are affiliate links — I may earn a commission at no extra cost to you.'}
  ];
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function icon(i){
    if(!i)return '';
    return i.charAt(0)==='/'?'<img src="'+esc(i)+'" alt="">':(ICONS[i]||'');
  }
  function item(l,n){
    var on=!!l.url;
    var tag=on?'a':'div';
    var attrs=on?' href="/go/'+esc(l.slug)+'?s=links"':' aria-disabled="true"';
    return '<'+tag+' class="lnk card lnk--'+esc(l.color||'mint')+(on?'':' is-off')+' rv" style="--i:'+n+'"'+attrs+'>'+
      '<span class="lnk-ic">'+icon(l.icon)+'</span>'+
      '<span class="lnk-t"><span class="lnk-name">'+esc(l.label)+'</span><span class="lnk-desc">'+esc(l.desc||'')+'</span></span>'+
      (on?'<span class="lnk-go">→</span>':'<span class="soon">Soon</span>')+
    '</'+tag+'>';
  }
  fetch('/data/links.json').then(function(r){return r.json();}).then(function(d){
    var n=3,html='';
    GROUPS.forEach(function(g){
      var items=(d.links||[]).filter(function(l){return l.group===g.id;});
      if(!items.length)return;
      html+='<section class="group"><h2 class="label group-title rv" style="--i:'+(n++)+'">'+esc(g.title)+'</h2>'+
        items.map(function(l){return item(l,n++);}).join('')+
        (g.note?'<p class="disclosure muted">'+esc(g.note)+'</p>':'')+'</section>';
    });
    var root=document.getElementById('groups');
    root.innerHTML=html;
    window.siteReveal(root);
  }).catch(function(){
    document.getElementById('groups').innerHTML='<p class="muted" style="text-align:center;margin-top:30px">Links are loading slowly — try again, or email <a href="mailto:seanjevangelista@gmail.com" style="text-decoration:underline">seanjevangelista@gmail.com</a>.</p>';
  });
})();
</script>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script>
<script defer src="/_vercel/insights/script.js"></script>
